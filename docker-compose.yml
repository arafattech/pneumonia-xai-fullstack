version: "3.9"

services:
  backend:
    build: ./backend
    container_name: pneumonia_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - model_weights:/app/app/ml/weights
    environment:
      - MODEL_PATH=/app/app/ml/weights/best_model.pth
      - DEVICE=cpu
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: pneumonia_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  model_weights:
